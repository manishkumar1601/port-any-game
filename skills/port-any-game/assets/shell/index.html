<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>port-any-game</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="shell/shell.css">
<script type="module" src="shell/shell.js"></script>
</head>
<body data-state="boot">
<main id="stage">
  <div id="host" aria-label="Game"></div>
  <div id="overlay" class="layer">
    <h1 id="title">Loading</h1>
    <p id="status" role="status" aria-live="polite">Loading. If this stays, open the build through pag serve, not from the file system.</p>
    <progress id="progress" value="0" max="1"></progress>
    <div id="import">
      <button id="pick" type="button">Choose game folder</button>
      <label class="link" for="dir-input">or use the classic folder chooser</label>
      <input id="dir-input" class="visually-hidden" type="file" webkitdirectory multiple>
      <p class="hint">You can also drop the folder here.</p>
    </div>
    <button id="play" type="button">Play</button>
  </div>
  <div id="error" class="layer" role="alert">
    <h2>Something went wrong</h2>
    <pre id="error-text"></pre>
    <p id="error-help"></p>
  </div>
</main>
<noscript><p class="noscript">This game needs JavaScript.</p></noscript>
</body>
</html>
