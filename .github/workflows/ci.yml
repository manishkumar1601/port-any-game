name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash
    env:
      # Linux has no GPU: verify adds these itself; repeating them is harmless.
      PAG_CHROME_FLAGS: ${{ matrix.os == 'ubuntu-latest' &&'--use-angle=swiftshader --enable-unsafe-swiftshader' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The e2e tool cache is <os.tmpdir()>/pag-e2e-tools (test/e2e/run.mjs); os.tmpdir() differs per OS, so ask node.
      - name: Locate the e2e tool cache and keep dir
        run: |
          node -e "const p=require('path'),d=require('os').tmpdir(),f=(n)=>p.join(d,n).split(p.sep).join('/');console.log('PAG_E2E_TOOLS='+f('pag-e2e-tools'));console.log('PAG_KEEP_DIR='+f('pag-e2e-keep'))" >> "$GITHUB_ENV"
      # PAG_E2E=0 skips the lane e2e cases (they run once, in the e2e step below). The verify/browser unit tests still launch
      # Chrome here: they need no runtime tools, so they stay in npm test.
      - name: Unit tests (lane e2e is skipped here; verify tests still use the browser)
        env:
          PAG_E2E: '0'
        # Same as npm test, plus a ::error annotation per failed test (the job log is not readable without a token).
        run: node --test --test-concurrency=1 --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./test/reporters/github.mjs --test-reporter-destination=stdout "test/**/*.test.mjs"
      - name: Validate
        run: node scripts/validate.mjs
      - name: Wrappers are up to date
        run: node scripts/gen-wrappers.mjs --check
      - name: Restore e2e tool cache
        id: tools
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PAG_E2E_TOOLS }}
          key: e2e-tools-${{ runner.os }}-${{ hashFiles('skills/port-any-game/scripts/toolchain.lock.json') }}
      - name: Setup runtimes (into the e2e tool cache)
        env:
          PAG_CACHE: ${{ env.PAG_E2E_TOOLS }}
        run: |
          node skills/port-any-game/scripts/pag.mjs setup ruffle --yes
          node skills/port-any-game/scripts/pag.mjs setup jsdos --yes
      - name: Lane e2e
        env:
          PAG_E2E_KEEP: ${{ env.PAG_KEEP_DIR }}
          PAG_E2E_REQUIRE_BROWSER: '1' # a runner without Chrome must fail, not skip
        run: npm run e2e
      # Saved even when e2e fails, so a red first run still keeps the downloads.
      - name: Save e2e tool cache
        if: always() && steps.tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.PAG_E2E_TOOLS }}
          key: e2e-tools-${{ runner.os }}-${{ hashFiles('skills/port-any-game/scripts/toolchain.lock.json') }}
      - name: Upload verify reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-${{ matrix.os }}
          path: ${{ env.PAG_KEEP_DIR }}/**/verify/**
          if-no-files-found: ignore
  # I5: the Playwright verify tier (spec §15: Playwright with SwiftShader + Xvfb on Linux). Playwright and its Chromium
  # go into the runner's temp dir, never a global or home location.
  playwright:
    name: playwright tier (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Locate the e2e tool cache
        run: |
          node -e "const p=require('path'),d=require('os').tmpdir();console.log('PAG_E2E_TOOLS='+p.join(d,'pag-e2e-tools').split(p.sep).join('/'))" >> "$GITHUB_ENV"
      - name: Setup Playwright (into the e2e tool cache)
        env:
          PAG_CACHE: ${{ env.PAG_E2E_TOOLS }}
          PLAYWRIGHT_BROWSERS_PATH: ${{ env.PAG_E2E_TOOLS }}/ms-playwright
        run: node skills/port-any-game/scripts/pag.mjs setup playwright --yes
      - name: Lane e2e through the Playwright runner (Xvfb)
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ env.PAG_E2E_TOOLS }}/ms-playwright
          PAG_E2E_REQUIRE_BROWSER: '1'
        run: xvfb-run -a node test/e2e/run.mjs web-extract --runner playwright --headed
